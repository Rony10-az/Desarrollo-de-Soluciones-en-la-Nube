services:
  backend1:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-1
      JWT_SECRET: local-lab-secret-change-me
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    ports:
      - "8081:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend2:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-2
      JWT_SECRET: local-lab-secret-change-me
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    ports:
      - "8082:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend3:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-3
      JWT_SECRET: local-lab-secret-change-me
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    ports:
      - "8083:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

